:root {
  color-scheme: dark;
  --paper: #14121a;
  --surface: #201d29;
  --chrome: #191620;
  --ink: #f1e7f0;
  --muted: #c0b3c6;
  --soft: #ab9bb5;
  --line: #393043;
  --line-hover: #665472;
  --hover: #2d2639;
  --violet-bg: #2c233b;
  --violet-active: #362844;
  --purple: #d5adee;
  --purple-strong: #e7c9fa;
  --pink-bg: #382333;
  --pink: #e7acd0;
  --peach: #39261f;
  --peach-strong: #493025;
  --orange-deep: #ffb594;
  --orange-border: #92614b;
  --current-card: #2a201f;
  --current-hover: #392a27;
  --green-bg: #21352e;
  --green: #a8e0c1;
  --green-border: #507b64;
  --track: #44374f;
  --meter-fill: #bc90db;
  --focus: #e0baff;
  --ambient: #2a1e37;
  --shadow: 0 7px 22px #0a081329;
  --orange: #ff8555;
  --radius: 21px;
  --page: 1220px;
  font-family: Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--paper);
  color: var(--ink);
}

:root[data-theme="light"] {
  color-scheme: light;
  --paper: #eae4e6;
  --surface: #f3edef;
  --chrome: #efe8eb;
  --ink: #291e2b;
  --muted: #5c5061;
  --soft: #63566b;
  --line: #d6c8d5;
  --line-hover: #bba7c2;
  --hover: #eadfec;
  --violet-bg: #e6dcee;
  --violet-active: #ddd0e7;
  --purple: #644181;
  --purple-strong: #513066;
  --pink-bg: #ecd8e6;
  --pink: #824368;
  --peach: #f3dfd3;
  --peach-strong: #efd5c7;
  --orange-deep: #993413;
  --orange-border: #bf795b;
  --current-card: #f3e5de;
  --current-hover: #f1ddd3;
  --green-bg: #dcebe2;
  --green: #235b42;
  --green-border: #91b69f;
  --track: #d6c7dc;
  --meter-fill: #82589f;
  --focus: #744b97;
  --ambient: #e6dae9;
  --shadow: 0 4px 18px #311b2e08;
}

*, *::before, *::after { box-sizing: border-box; }
body { background: radial-gradient(ellipse at 78% -25%, var(--ambient), transparent 62%); min-width: 280px; min-height: 100vh; margin: 0; display: flex; flex-direction: column; }
#main { flex: 1; outline: none; }
[hidden] { display: none !important; }
img { max-width: 100%; }
button, input, select { font: inherit; }
button { color: inherit; }
a { color: inherit; text-decoration: none; }
button, a { -webkit-tap-highlight-color: transparent; }
button:not(:disabled), summary, input[type="range"] { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
h1, h2, h3, p { margin: 0; }
p { line-height: 1.65; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; border: 0;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap;
}
.skip-link { position: absolute; left: 1rem; top: -5rem; z-index: 10; background: var(--surface); color: var(--ink); border-radius: 10px; padding: 12px; }
.skip-link:focus { top: 1rem; }
.icon {
  display: inline-block; width: 1em; height: 1em; flex: 0 0 auto; overflow: hidden;
  font-family: "Material Symbols Rounded"; font-weight: 500; font-style: normal;
  font-size: 22px; line-height: 1; letter-spacing: normal; text-transform: none;
  white-space: nowrap; word-wrap: normal; direction: ltr;
  font-feature-settings: "liga"; -webkit-font-smoothing: antialiased;
}
.topbar { background: var(--chrome); border-bottom: 1px solid var(--line); }
.topbar-inner, .shell, .footer-inner { width: min(var(--page), calc(100% - 64px)); margin-inline: auto; }
.topbar-inner {
  min-height: 75px; display: grid; grid-template-columns: minmax(145px, 1fr) auto minmax(190px, 1fr);
  align-items: center; gap: 18px;
}
.brand {
  display: inline-flex; align-items: center; justify-self: start; gap: 10px;
  font-size: 1.64rem; font-weight: 800; letter-spacing: -.075em; line-height: 1;
}
.brand-stop { color: var(--orange-deep); }
.brand-mark {
  width: 38px; height: 38px; position: relative; display: inline-block; flex: none;
  border-radius: 12px; background: #ea5f36; color: #fff9f4; box-shadow: inset 0 -3px #ac351f22;
}
.brand-mark i { position: absolute; width: 25px; height: 10px; left: 6.5px; top: 14px; border: 1.5px solid currentColor; border-radius: 50%; transform: rotate(-48deg); }
.brand-mark i:nth-child(2) { transform: rotate(48deg); opacity: .9; }
.brand-mark b { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: currentColor; left: 17px; top: 17px; }
.topnav, .top-actions { display: flex; align-items: center; gap: 5px; }
.topnav a, .stat-button, .icon-button, .text-button {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  font-size: .91rem; font-weight: 750; border: 0; background: transparent; border-radius: 10px;
}
.topnav a { padding: 10px 13px; min-height: 43px; color: var(--muted); }
.topnav a .icon { font-size: 19px; }
.topnav a[aria-current="page"] { color: var(--orange-deep); background: var(--peach); font-weight: 800; }
.topnav a:hover:not([aria-current]) { background: var(--hover); color: var(--ink); }
.top-actions { justify-content: flex-end; gap: 7px; }
.stat-button { min-height: 40px; padding: 5px 9px; white-space: nowrap; color: var(--ink); }
.stat-button:hover, .icon-button:hover { background: var(--hover); }
.stat-button .icon { font-size: 21px; }
.stat-fire .icon { color: var(--orange-deep); }
.stat-xp .icon { color: var(--purple); }
.top-actions .settings { margin-left: 7px; }
.icon-button { width: 40px; height: 40px; color: var(--muted); flex: 0 0 auto; }
.icon-button .icon { font-size: 21px; }
.icon-button.outline { border: 1px solid var(--line); background: var(--surface); }
.icon-button.outline:hover { background: var(--violet-bg); }
.shell { padding-block: 29px 54px; }
.enter { animation: enter .24s ease-out both; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.button {
  display: inline-flex; justify-content: center; align-items: center; gap: 8px; padding: 11px 17px;
  min-height: 44px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line);
  font-size: .93rem; font-weight: 800; line-height: 1.25; text-align: center;
  transition: background-color .16s ease, border-color .16s ease, transform .16s ease, box-shadow .16s ease;
}
.button:hover { background: var(--hover); border-color: var(--line-hover); }
.button:active { transform: translateY(1px); }
.button .icon { font-size: 19px; }
.button:not([href]):not(button) { cursor: default; }
.button.primary { color: #241523; background: var(--orange); border-color: #f58255; box-shadow: 0 3px #d46039; }
.button.primary:hover { background: #ff9a71; border-color: #fb936e; box-shadow: 0 3px #d46039, 0 6px 18px #cb5b3430; }
.button.violet { color: var(--purple-strong); background: var(--violet-bg); border-color: var(--line); }
.button.violet:hover { background: var(--violet-active); border-color: var(--line-hover); }
.button:disabled { opacity: .53; box-shadow: none; }
.button.large { min-height: 51px; padding-inline: 22px; font-size: 1rem; }
.button.small { min-height: 36px; padding: 7px 13px; font-size: .86rem; border-radius: 10px; }
.text-button { padding: 7px 0; color: var(--muted); }
.text-button:hover { color: var(--purple); text-decoration: underline; text-underline-offset: 4px; }

.hero {
  position: relative; isolation: isolate; display: flex; align-items: center; min-height: 365px;
  padding: 39px 46px 43px; overflow: hidden; border: 1px solid #513347; border-radius: 26px; background: #1b1021; color: #fff8f5;
}
.hero-art {
  position: absolute; z-index: -2; inset: 0 0 0 37%;
  background: #1b1021 var(--orbit-art) center 51% / cover no-repeat;
  animation: breathing 17s ease-in-out infinite alternate;
}
.hero::before {
  content: ""; position: absolute; z-index: -1; inset: 0;
  background: linear-gradient(90deg, #211325 0%, #211325 30%, #211325f0 38%, #21132565 53%, #21132500 67%),
    linear-gradient(0deg, #21132524, transparent 31%);
}
@keyframes breathing { from { transform: scale(1); } to { transform: scale(1.055); } }
.hero-content { position: relative; max-width: 570px; }
.eyebrow {
  font-size: .78rem; font-weight: 800; line-height: 1.4; letter-spacing: .12em; text-transform: uppercase;
  display: inline-flex; align-items: center; gap: 7px;
}
.eyebrow .icon { font-size: 17px; }
.hero .eyebrow { color: #ffb08f; }
.hero h1 { margin-block: 12px 13px; font-size: clamp(2.8rem, 5vw, 4.12rem); font-weight: 800; line-height: 1.005; letter-spacing: -.072em; }
.hero h1 span { display: block; color: #ff9a73; }
.hero p { max-width: 373px; color: #e1d3e1; font-size: 1.04rem; font-weight: 550; }
.hero-actions { display: flex; gap: 17px; align-items: center; flex-wrap: wrap; margin-top: 24px; }
.hero .button { white-space: nowrap; }
.hero-time { display: inline-flex; gap: 6px; align-items: center; font-size: .89rem; font-weight: 650; color: #deccdf; }
.hero-time .icon { font-size: 17px; }
.hero-download { color: #ffd1bd; font-size: .89rem; font-weight: 750; text-decoration: underline; text-underline-offset: .2em; }
.hero-download:hover { color: #fff9f4; }

.dashboard { display: grid; grid-template-columns: minmax(0, 1fr) 326px; gap: 28px; margin-top: 30px; align-items: start; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.section-head h2 { font-size: clamp(1.5rem, 2.7vw, 1.95rem); font-weight: 800; letter-spacing: -.049em; }
.section-head .button { flex-shrink: 0; }
.section-head.slim { margin: 25px 0 12px; }
.section-head.slim h2 { font-size: 1.35rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.unit-banner {
  padding: 17px 19px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px;
  background: linear-gradient(115deg, var(--violet-bg), var(--surface)); border-color: var(--line); box-shadow: none;
}
.tile {
  width: 48px; height: 48px; display: inline-grid; place-items: center; flex: 0 0 auto;
  border-radius: 14px; background: var(--violet-bg); color: var(--purple);
}
.tile .icon { font-size: 25px; }
.tile.orange { background: var(--peach); color: var(--orange-deep); }
.tile.lilac { background: var(--violet-active); color: var(--purple); }
.tile.green { background: var(--green-bg); color: var(--green); }
.tile.pink { background: var(--pink-bg); color: var(--pink); }
.tile.soft { background: var(--hover); color: var(--muted); }
.unit-banner .unit-label { color: var(--purple); margin-bottom: 3px; letter-spacing: .045em; }
.unit-banner h3 { font-size: 1.25rem; font-weight: 800; letter-spacing: -.04em; line-height: 1.22; }
.unit-banner p { margin-top: 4px; color: var(--muted); font-size: .87rem; font-weight: 650; }
.unit-progress { min-width: 80px; text-align: right; }
.unit-progress span { color: var(--purple); font-weight: 800; font-size: .83rem; white-space: nowrap; }
.meter { overflow: hidden; background: var(--track); height: 7px; border-radius: 99px; }
.meter > span { display: block; height: 100%; width: var(--pct, 0%); border-radius: inherit; background: var(--meter-fill); transition: width .3s ease; }
.unit-progress .meter { width: 80px; margin: 7px 0 0 auto; }

'use strict';

const STORAGE_KEY = 'orbita.physics.v1';
const DAY_MS = 86_400_000;
const DAY_FORMAT = new Intl.DateTimeFormat('en-CA', {
  timeZone: 'Asia/Tashkent', year: 'numeric', month: '2-digit', day: '2-digit',
});
const REVIEW_INTERVALS = [1, 3, 7, 14, 30, 60];
const THEMES = ['dark', 'light', 'system'];
const freshProgress = () => ({
  completed: {}, review: {}, mistakes: {}, drafts: {}, practice: null,
  activeDays: [], practiceDays: [], protectedDays: [], shields: 1, sound: true, effects: true,
  theme: 'dark', textSize: 'regular',
});

function calendarDay(date = new Date()) {
  const parts = Object.fromEntries(DAY_FORMAT.formatToParts(date).map(({ type, value }) => [type, value]));
  return Date.UTC(Number(parts.year), Number(parts.month) - 1, Number(parts.day)) / DAY_MS;
}

function russianDate(day) {
  return new Intl.DateTimeFormat('ru', { day: 'numeric', month: 'long', timeZone: 'UTC' })
    .format(new Date(day * DAY_MS));
}

function plural(n, one, few, many) {
  const tens = n % 100;
  if (tens >= 11 && tens <= 19) return many;
  const units = n % 10;
  return units === 1 ? one : units >= 2 && units <= 4 ? few : many;
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const saved = raw ? JSON.parse(raw) : null;
    return { data: { ...freshProgress(), ...saved }, available: true };
  } catch {
    return { data: freshProgress(), available: false };
  }
}

let { data: progress, available: storageAvailable } = loadProgress();

function updateProgress(change) {
  const latest = loadProgress();
  if (latest.available && storageAvailable) progress = latest.data;
  change(progress);
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
    storageAvailable = true;
  } catch {
    storageAvailable = false;
  }
}

function logActiveDay(state, day) {
  if (state.activeDays.includes(day)) return;
  state.activeDays.push(day);
  if (state.activeDays.length % 7 === 0) state.shields = 1;
}

function streaks(state, today) {
  const active = new Set(state.activeDays.filter(day => day <= today));
  const protectedDays = new Set(state.protectedDays.filter(day => day <= today && !active.has(day)));
  const days = [...new Set([...active, ...protectedDays])].sort((a, b) => a - b);
  let best = 0;
  let count = 0;
  let previous = -Infinity;
  for (const day of days) {
    if (day !== previous + 1) count = 0;
    if (active.has(day)) count += 1;
    best = Math.max(count, best);
    previous = day;
  }
  return { current: previous >= today - 1 ? count : 0, best, active, protectedDays };
}

function mayRestore(state, today) {
  return state.shields > 0 && state.activeDays.includes(today - 2) &&
    !state.activeDays.includes(today - 1) && !state.protectedDays.includes(today - 1);
}

function weekDays(today) {
  const weekday = new Date(today * DAY_MS).getUTCDay();
  const monday = today - (weekday + 6) % 7;
  return Array.from({ length: 7 }, (_, index) => monday + index);
}

const questionKey = (id, index) => id + ':' + index;

function reviewStatus(state, today) {
  const learned = Object.keys(state.completed).filter(id => LESSON_BY_ID[id]);
  const due = learned.filter(id => state.review[id]?.due <= today)
    .sort((a, b) => state.review[a].due - state.review[b].due);
  const mistakes = Object.keys(state.mistakes).map(key => {
    const [id, index] = key.split(':');
    return { id, index: Number(index) };
  }).filter(({ id, index }) => LESSON_BY_ID[id]?.questions[index]);
  const upcoming = learned.map(id => state.review[id]?.due).filter(day => day > today).sort((a, b) => a - b);
  return { learned, due, mistakes, upcoming: upcoming[0] };
}

function practiceQueue(state, today, mode) {
  const { due, mistakes, learned } = reviewStatus(state, today);
  if (mode === 'mistakes') return mistakes.slice(0, 6);
  if (mode === 'due') return due.slice(0, 6).map(id => ({ id, index: state.review[id].stage % LESSON_BY_ID[id].questions.length }));
  const selected = learned.slice().sort((a, b) => state.completed[b] - state.completed[a]).slice(0, 3);
  return selected.flatMap(id => LESSON_BY_ID[id].questions.slice(0, 2).map((question, index) => ({ id, index }))).slice(0, 6);
}

function recordLesson(state, id, today) {
  const first = !Object.hasOwn(state.completed, id);
  if (first) {
    state.completed[id] = today;
    state.review[id] = { stage: 0, due: today + REVIEW_INTERVALS[0] };
  }
  delete state.drafts[id];
  logActiveDay(state, today);
  return first ? 30 : 0;
}

function recordPractice(state, run, today) {
  const results = new Map();
  for (const { id, index } of run.items) {
    const key = questionKey(id, index);
    const rightFirstTime = !run.missed.includes(key);
    if (rightFirstTime) delete state.mistakes[key];
    results.set(id, (results.get(id) ?? true) && rightFirstTime);
  }
  for (const [id, rightFirstTime] of results) {
    const entry = state.review[id];
    if (!entry) continue;
    if (!rightFirstTime) {
      state.review[id] = { stage: Math.max(0, entry.stage - 1), due: today + 1 };
    } else if (entry.due <= today) {
      const stage = Math.min(entry.stage + 1, REVIEW_INTERVALS.length - 1);
      state.review[id] = { stage, due: today + REVIEW_INTERVALS[stage] };
    }
  }
  const first = !state.practiceDays.includes(today);
  if (first) state.practiceDays.push(today);
  logActiveDay(state, today);
  state.practice = null;
  return first ? 15 : 0;
}

function numberFromAnswer(text) {
  const clean = text.trim().replace(/[−–]/g, '-').replace(/[ \u00a0\u202f]/g, '').replace(',', '.')
    .replace(/[×x*]10\^([+-]?\d+)$/i, 'e$1');
  if (!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/i.test(clean)) return NaN;
  return Number(clean);
}

function answerMatches(question, value) {
  if (question.options) return Number(value) === question.answer;
  const number = numberFromAnswer(value);
  const tolerance = Math.max(question.tolerance, Math.abs(question.answer) * 1e-10, 1e-12);
  return Number.isFinite(number) && Math.abs(number - question.answer) <= tolerance;
}

function parseProgressBackup(text) {
  const backup = JSON.parse(text);
  const data = backup?.progress;
  const isRecord = value => value && typeof value === 'object' && !Array.isArray(value);
  const isDay = day => Number.isInteger(day) && day > 0 && day < 1_000_000;
  const isLesson = id => typeof id === 'string' && Object.hasOwn(LESSON_BY_ID, id);
  const isQuestion = (id, index) => isLesson(id) && Number.isInteger(index) && index >= 0 && index < LESSON_BY_ID[id].questions.length;
  const isKey = key => {
    const match = typeof key === 'string' && /^([a-z0-9-]+):(\d+)$/.exec(key);
    return Boolean(match && isQuestion(match[1], Number(match[2])));
  };
  const check = condition => {
    if (!condition) throw new Error('Invalid Orbita backup');
  };
  const map = (input, test) => {
    check(isRecord(input));
    const entries = Object.entries(input);
    check(entries.every(([key, value]) => test(key, value)));
    return Object.fromEntries(entries);
  };
  const list = (input, test) => {
    check(Array.isArray(input) && input.every(test));
    return [...new Set(input)];
  };
  const validRun = (run, length) => isRecord(run) && Number.isInteger(run.step) && run.step >= 0 && run.step < length &&
    typeof run.value === 'string' && run.value.length <= 128 && [null, 'correct', 'retry'].includes(run.feedback) &&
    Array.isArray(run.missed) && run.missed.every(isKey);

  check(backup?.format === 'orbita-progress' && backup.version === 1 && isRecord(data));
  check(typeof data.sound === 'boolean' && typeof data.effects === 'boolean');
  check(THEMES.includes(data.theme) && ['regular', 'large'].includes(data.textSize));
  check(data.shields === 0 || data.shields === 1);
  check(data.practice === null || (Array.isArray(data.practice?.items) && data.practice.items.length <= 6 &&
    data.practice.items.every(ref => ref && isQuestion(ref.id, ref.index)) && validRun(data.practice, data.practice.items.length)));
  const completed = map(data.completed, (id, day) => isLesson(id) && isDay(day));
  return {
    completed,
    review: map(data.review, (id, entry) => Object.hasOwn(completed, id) && isRecord(entry) &&
      Number.isInteger(entry.stage) && entry.stage >= 0 && entry.stage < REVIEW_INTERVALS.length && isDay(entry.due)),
    mistakes: map(data.mistakes, (key, value) => isKey(key) && value === true),
    drafts: map(data.drafts, (id, run) => isLesson(id) && validRun(run, LESSON_BY_ID[id].questions.length + 2)),
    practice: data.practice,
    activeDays: list(data.activeDays, isDay),
    practiceDays: list(data.practiceDays, isDay),
    protectedDays: list(data.protectedDays, isDay),
    shields: data.shields,
    sound: data.sound,
    effects: data.effects,
    theme: data.theme,
    textSize: data.textSize,
  };
}

function weekStrip(today, stats) {
  const labels = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
  return `<ul class="week" aria-label="Занятия на этой неделе">${weekDays(today).map((day, index) => {
    const active = stats.active.has(day);
    const protectedDay = stats.protectedDays.has(day);
    const current = day === today ? ' is-today' : '';
    const state = active ? ' is-active' : protectedDay ? ' is-protected' : '';
    const label = active ? 'занятие выполнено' : protectedDay ? 'день защищён' : day > today ? 'предстоящий день' : 'без занятия';
    return `<li class="${current + state}" title="${esc(russianDate(day) + ', ' + label)}"><span aria-hidden="true">${labels[index]}</span><span class="sr-only">${esc(russianDate(day) + ', ' + label)}</span><span class="day" aria-hidden="true">${active ? icon('check') : protectedDay ? icon('shield') : ''}</span></li>`;
  }).join('')}</ul>`;
}

function stepProgress(step, count, label) {
  return `<div class="step-progress" role="progressbar" aria-label="${esc(label)}" aria-valuenow="${step + 1}" aria-valuemin="1" aria-valuemax="${count}">
    ${Array.from({ length: count }, (_, index) => `<span class="${index < step ? 'is-done' : index === step ? 'is-current' : ''}"></span>`).join('')}
    <small aria-hidden="true">${step + 1} / ${count}</small>
  </div>`;
}

const emptyRun = () => ({ step: 0, value: '', feedback: null, missed: [] });

function runContext() {
  if (currentRoute[0] === 'practice' && currentRoute[1] === 'session' && progress.practice) {
    const run = progress.practice;
    const ref = run.items[run.step];
    if (!ref) return null;
    const item = LESSON_BY_ID[ref.id];
    return { run, item, index: ref.index, count: run.items.length, practicing: true };
  }
  if (currentRoute[0] === 'lesson' && !currentRoute[2] && Object.hasOwn(LESSON_BY_ID, currentRoute[1])) {
    const item = LESSON_BY_ID[currentRoute[1]];
    const run = progress.drafts[item.id] || emptyRun();
    return { run, item, index: run.step - 2, count: item.questions.length + 2, practicing: false };
  }
  return null;
}

function updateRun(context, edit) {
  updateProgress(state => {
    const run = context.practicing ? state.practice : state.drafts[context.item.id] ||= emptyRun();
    if (run && run.step === context.run.step) edit(run, state);
  });
}

function feedbackHTML(feedback, question) {
  if (!feedback) return '';
  const correct = feedback === 'correct';
  return `<div class="feedback ${correct ? 'ok' : 'retry'}" tabindex="-1">

      <strong>${correct ? 'Верно!' : 'Попробуй ещё'}</strong>
      <p>${esc(correct ? question.explanation : question.hint)}</p>

  </div>`;
}

function questionHTML(context) {
  const { run, item, index, practicing, count } = context;

  const selected = run.value;

  const optionLabels = ['1', '2', '3', '4'];
  return `<article class="card lesson-panel">

          return `<button class="option ${variant}" type="button" data-action="option" data-index="${optionIndex}" aria-pressed="${chosen}" ${correct ? 'disabled' : ''}>

function showDialog(kind) {

  if (!dialog.open) dialog.showModal();
}

function backupStatus(text) {
  const status = dialog.querySelector('#backup-status');
  status.textContent = text;
  status.hidden = false;
}

function exportProgress() {
  const data = JSON.stringify({ format: 'orbita-progress', version: 1, progress }, null, 2);
  const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  const download = document.createElement('a');
  download.href = url;
  download.download = 'orbita-progress.json';
  document.body.append(download);
  download.click();
  download.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

async function chooseProgressBackup(input) {
  const file = input.files[0];
  if (!file) return;
  pendingBackup = null;
  dialog.querySelector('[data-action="apply-backup"]').hidden = true;
  dialog.querySelector('#backup-status').hidden = true;
  try {
    if (file.size > 1_000_000) throw new Error('File is too large');
    const backup = parseProgressBackup(await file.text());
    if (!input.isConnected || !dialog.open || input.files[0] !== file) return;
    pendingBackup = backup;
    const count = Object.keys(backup.completed).length;
    backupStatus(`В копии ${count} ${itemLabel(count)}. Восстановление заменит прогресс и настройки в этом браузере.`);
    dialog.querySelector('[data-action="apply-backup"]').hidden = false;
  } catch {
    if (input.isConnected && dialog.open && input.files[0] === file) backupStatus('Эта копия повреждена или создана другой программой. Выбери JSON, скачанный из «Орбиты».');
  } finally {
    if (input.files[0] === file) input.value = '';
  }
}

function focusHeading() {
  const heading = main.querySelector('h1');
  if (heading) {
    heading.tabIndex = -1;
    heading.focus({ preventScroll: true });
  }
}

function renderRoute(moveFocus = false) {
  currentRoute = (location.hash.slice(1) || 'learn').split('/');
  const [tab, id, finalStep] = currentRoute;
  stopLab?.();
  stopLab = null;
  updateHeader();
  document.title = 'Орбита — физика с нуля';
  if (tab === 'program') programPage();
  else if (tab === 'math') mathPage();
  else if (tab === 'labs') stopLab = labPage(id, finalStep);
  else if (tab === 'practice' && id === 'done') renderResult(true);
  else if (tab === 'practice' && id === 'session' && runContext()) lessonHTML(runContext());
  else if (tab === 'practice') practicePage();
  else if (tab === 'lesson' && finalStep === 'done' && Object.hasOwn(LESSON_BY_ID, id) && lessonDone(id)) {
    renderResult(false, LESSON_BY_ID[id]);
  } else if (tab === 'lesson' && runContext()) lessonHTML(runContext());
  else dashboard();
  if (moveFocus) {
    window.scrollTo({ top: 0, behavior: 'auto' });
    focusHeading();
  }
}

function go(hash) {
  if (location.hash === hash) renderRoute(true);
  else location.hash = hash;
}

function sparkles(container, count) {
  if (!container || !progress.effects || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['#f87f4c', '#a77cc5', '#ecc15d', '#77b59a'];
  const wrapper = document.createElement('div');
  wrapper.className = 'sparkles';
  wrapper.setAttribute('aria-hidden', 'true');
  for (let index = 0; index < count; index++) {
    const dot = document.createElement('i');
    const direction = index % 2 ? 1 : -1;
    dot.style.setProperty('--x', (42 + Math.random() * 16) + '%');
    dot.style.setProperty('--dx', direction * (30 + Math.random() * 115) + 'px');
    dot.style.setProperty('--dy', (-24 - Math.random() * 67) + 'px');
    dot.style.setProperty('--delay', (index % 4) * 22 + 'ms');
    dot.style.setProperty('--spark', colors[index % colors.length]);
    wrapper.append(dot);
  }
  container.append(wrapper);
  setTimeout(() => wrapper.remove(), 900);
}

async function sound(kind) {
  if (!progress.sound) return;
  const Audio = window.AudioContext || window.webkitAudioContext;
  if (!Audio) return;
  try {
    audioContext ||= new Audio();
    if (audioContext.state === 'suspended') await audioContext.resume();
    const notes = kind === 'finish' ? [440, 554.37, 659.25, 880] : [523.25, 659.25, 783.99];
    const now = audioContext.currentTime;
    notes.forEach((frequency, index) => {
      const tone = audioContext.createOscillator();
      const envelope = audioContext.createGain();
      const start = now + index * .075;
      tone.type = 'sine';
      tone.frequency.value = frequency;
      envelope.gain.setValueAtTime(.001, start);
      envelope.gain.exponentialRampToValueAtTime(.12, start + .013);
      envelope.gain.exponentialRampToValueAtTime(.001, start + .19);
      tone.connect(envelope);
      envelope.connect(audioContext.destination);
      tone.start(start);
      tone.stop(start + .20);
    });
  } catch {
    // A browser or system audio policy can disable the optional sound.
  }
}

function advance() {
  const context = runContext();
  if (!context || context.index >= 0 && context.run.feedback !== 'correct') return;
  const { item, count, practicing } = context;
  if (context.run.step === count - 1) {
    updateRun(context, (run, state) => {
      if (run.feedback !== 'correct') return;
      const xp = practicing ? recordPractice(state, run, calendarDay()) : recordLesson(state, item.id, calendarDay());
      lastOutcome = { practicing, id: item.id, xp, total: practicing ? count : count - 2, missed: run.missed.length };
    });
    sound('finish');
    go(practicing ? '#practice/done' : `${lessonLink(item.id)}/done`);
    return;
  }
  updateRun(context, run => {
    run.step += 1;
    run.feedback = null;
    run.value = '';
  });
  renderRoute(true);
}

function selectOption(control) {
  const form = control.closest('form');
  if (!form || control.disabled) return;
  for (const option of form.querySelectorAll('.option')) {
    option.setAttribute('aria-pressed', String(option === control));
    option.classList.remove('try');
  }
  form.querySelector('#choice-value').value = control.dataset.index;
  form.querySelector('#check-answer').disabled = false;
}

function acceptAnswer(event) {
  if (event.target.id !== 'answer-form') return;
  event.preventDefault();
  const context = runContext();
  if (!context || context.run.feedback === 'correct') return;
  const question = context.item.questions[context.index];
  const form = event.target;
  const value = form.querySelector(question.options ? '#choice-value' : '#number-answer').value.trim();
  if (!value) return;
  if (!question.options && !Number.isFinite(numberFromAnswer(value))) {
    message('Введи число, например 2,5 или −3.');
    form.querySelector('#number-answer').focus();
    return;
  }
  const correct = answerMatches(question, value);
  updateRun(context, (run, state) => {
    run.value = value;
    run.feedback = correct ? 'correct' : 'retry';
    if (!correct) {
      const key = questionKey(context.item.id, context.index);
      state.mistakes[key] = true;
      if (!run.missed.includes(key)) run.missed.push(key);
    }
  });
  renderRoute();
  const feedback = main.querySelector('.feedback');
  feedback?.focus();
  alertUser(feedback?.textContent.trim() || '');
  if (correct) {
    sound('correct');
    sparkles(feedback, 9);
  }
}

function startPractice(mode) {
  if (progress.practice) {
    go('#practice/session');
    return;
  }
  const items = practiceQueue(progress, calendarDay(), mode);
  if (!items.length) return;
  updateProgress(state => { state.practice ||= { ...emptyRun(), items }; });
  go('#practice/session');
}

document.addEventListener('click', event => {
  if (event.target.closest('.skip-link')) {
    event.preventDefault();
    main.focus();
    return;
  }
  const control = event.target.closest('[data-action]');
  if (!control) return;
  const action = control.dataset.action;
  if (action === 'option') selectOption(control);
  if (action === 'advance') advance();
  if (action === 'previous') {
    const context = runContext();
    if (context && context.run.step === 1 && !context.practicing) {
      updateRun(context, run => { run.step = 0; });
      renderRoute(true);
    }
  }
  if (action === 'practice-start') startPractice(control.dataset.mode);
  if (action === 'filter') {
    programLevel = Number(control.dataset.level);
    programPage();
    main.querySelector('[aria-pressed="true"]')?.focus();
  }
  if (['about', 'stats', 'streak', 'settings'].includes(action)) showDialog(action);
  if (action === 'close') dialog.close();
  if (action === 'export-progress') exportProgress();
  if (action === 'choose-backup') dialog.querySelector('#progress-file').click();
  if (action === 'apply-backup' && pendingBackup) {
    updateProgress(state => { Object.assign(state, pendingBackup); });
    lastOutcome = null;
    renderRoute();
    showDialog('settings');
    backupStatus(storageAvailable ? 'Прогресс восстановлен.' : 'Прогресс загружен для этой вкладки. Браузер не сохранил его между сеансами.');
  }
  if (action === 'restore') {
    const today = calendarDay();
    if (!mayRestore(progress, today)) return;
    updateProgress(state => {
      if (mayRestore(state, today)) {
        state.protectedDays.push(today - 1);
        state.shields -= 1;
      }
    });
    renderRoute();
    if (dialog.open) showDialog('streak');
    message('Вчерашний день защищён.');
  }
  if (action === 'sound') {
    updateProgress(state => { state.sound = !state.sound; });
    updateHeader();
    topActions.querySelector('[data-action="sound"]').focus();
    if (progress.sound) sound('correct');
    message(progress.sound ? 'Звук включён.' : 'Звук выключен.');
  }
});

document.addEventListener('change', event => {
  const control = event.target;
  if (control.id === 'progress-file') {
    chooseProgressBackup(control);
    return;
  }
  const setting = control.dataset.setting;
  if (setting === 'theme' || setting === 'textSize') {
    updateProgress(state => { state[setting] = control.value; });
    applyAppearance();
  }
  if (setting === 'sound' || setting === 'effects') {
    updateProgress(state => { state[setting] = control.checked; });
    updateHeader();
    if (setting === 'sound' && progress.sound) sound('correct');
  }
});

dialog.addEventListener('close', () => { pendingBackup = null; });

document.addEventListener('submit', acceptAnswer);
document.addEventListener('input', event => {
  if (event.target.id === 'number-answer' && !event.target.readOnly) {
    main.querySelector('#check-answer').disabled = !event.target.value.trim();
  }
});
document.addEventListener('keydown', event => {
  if (dialog.open || event.altKey || event.ctrlKey || event.metaKey || event.target.matches('input, textarea, select')) return;
  if (!/^[1-4]$/.test(event.key)) return;
  const option = main.querySelector(`.option[data-index="${Number(event.key) - 1}"]:not(:disabled)`);
  if (option) {
    event.preventDefault();
    selectOption(option);
    option.focus();
  }
});
window.addEventListener('hashchange', () => renderRoute(true));
window.addEventListener('storage', event => {
  if (event.key !== STORAGE_KEY && event.key !== null) return;
  progress = loadProgress().data;
  if (['learn', 'program', 'practice'].includes(currentRoute[0]) && !runContext() && !dialog.open) renderRoute();
  else updateHeader();
});
let visibleDay = calendarDay();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || calendarDay() === visibleDay) return;
  visibleDay = calendarDay();
  if (['learn', 'practice'].includes(currentRoute[0]) && !runContext() && !dialog.open) renderRoute();
  else updateHeader();
});

function offlineDownloadUrl() {
  const url = new URL(location.href);
  url.hash = '';
  return url.href;
}

function startApp() {
  document.querySelector('#download-site').href = offlineDownloadUrl();
  if (pagesArchive) {
    const download = document.querySelector('#download-pages');
    download.href = pagesArchive;
    download.hidden = false;
  }
  renderRoute();
}


'use strict';

const CANVAS_W = 640;
const CANVAS_H = 310;
const PALETTE = { plum: '#25162f', grid: '#3d2950', label: '#d8c7e7', violet: '#ba9bd6', peach: '#ff9d73', yellow: '#ffcb77' };
const displayNumber = new Intl.NumberFormat('ru', { maximumFractionDigits: 2 }).format;
const valueWithUnit = (value, unit) => displayNumber(value) + ' ' + unit;

function line(ctx, points, color, width = 1, dash = []) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.setLineDash(dash);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  points.forEach(([x, y], index) => index ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.stroke();
  ctx.restore();
}

function dot(ctx, x, y, radius, color, glow = false) {
  ctx.save();
  ctx.fillStyle = color;
  if (glow) {
    ctx.shadowColor = color;
    ctx.shadowBlur = 16;
  }
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function label(ctx, text, x, y, color = PALETTE.label, size = 16, align = 'left') {
  ctx.save();
  ctx.fillStyle = color;
  ctx.font = `700 ${size}px Manrope, sans-serif`;
  ctx.textAlign = align;
  ctx.fillText(text, x, y);
  ctx.restore();
}

function arrow(ctx, from, to, y, color) {
  if (Math.abs(from - to) < 1) return;
  const sign = Math.sign(to - from);
  line(ctx, [[from, y], [to, y]], color, 4);
  line(ctx, [[to - 11 * sign, y - 7], [to, y], [to - 11 * sign, y + 7]], color, 4);
}

function box(ctx, x, y, width, height, color, radius = 9) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(x, y, width, height, radius);
  ctx.fill();
}

function backdrop(ctx) {
  ctx.fillStyle = PALETTE.plum;
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
  for (let x = 24; x < CANVAS_W; x += 24) line(ctx, [[x, 0], [x, CANVAS_H]], PALETTE.grid);
  for (let y = 24; y < CANVAS_H; y += 24) line(ctx, [[0, y], [CANVAS_W, y]], PALETTE.grid);
}

function drawMotion(ctx, values, t) {
  const x = values.start + values.speed * t;
  const drawX = position => 320 + position * 10.8;
  line(ctx, [[61, 111], [579, 111]], '#9d7bb1', 2);
  for (let tick = -20; tick <= 20; tick += 5) {
    const px = drawX(tick);
    line(ctx, [[px, 108], [px, 116]], PALETTE.violet, 1.5);
    label(ctx, String(tick), px, 136, PALETTE.label, 14, 'center');
  }
  line(ctx, [[drawX(values.start), 102], [drawX(x), 102]], PALETTE.violet, 2, [3, 6]);
  box(ctx, drawX(x) - 21, 78, 42, 17, PALETTE.peach, 5);
  dot(ctx, drawX(x) - 11, 99, 4, PALETTE.yellow);
  dot(ctx, drawX(x) + 11, 99, 4, PALETTE.yellow);
  label(ctx, 'Координата, м', 32, 43);
  label(ctx, 'График x(t)', 32, 169);
  const gx = time => 52 + 104 * time;
  const gy = pos => 226 - pos * 2.05;
  line(ctx, [[52, 175], [52, 273]], PALETTE.violet, 1.3);
  line(ctx, [[52, gy(0)], [574, gy(0)]], PALETTE.violet, 1.3);
  line(ctx, [[gx(0), gy(values.start)], [gx(5), gy(values.start + values.speed * 5)]], PALETTE.violet, 1.5, [5, 5]);
  if (t > 0) line(ctx, [[gx(0), gy(values.start)], [gx(t), gy(x)]], PALETTE.peach, 3);
  dot(ctx, gx(t), gy(x), 5, PALETTE.peach, true);
  label(ctx, '0', 46, 293, PALETTE.label, 14);
  label(ctx, '5 с', 563, 293, PALETTE.label, 14);
}

function accelerationOf(values) {
  return (values.right - values.left) / values.mass;
}

function drawForce(ctx, values, t) {
  const a = accelerationOf(values);
  const x = 320 + Math.tanh(a * t * t / 97) * 195;
  line(ctx, [[48, 197], [592, 197]], PALETTE.violet, 2);
  for (let tick = 65; tick < 593; tick += 20) line(ctx, [[tick, 197], [tick - 7, 205]], PALETTE.grid, 2);
  line(ctx, [[320, 205], [320, 220]], PALETTE.violet, 2);
  label(ctx, 'старт', 320, 240, PALETTE.label, 15, 'center');
  box(ctx, x - 32, 151, 64, 36, '#9469b0');
  dot(ctx, x - 18, 190, 7, PALETTE.yellow);
  dot(ctx, x + 18, 190, 7, PALETTE.yellow);
  label(ctx, valueWithUnit(values.mass, 'кг'), x, 174, '#fff5ff', 15, 'center');
  arrow(ctx, x + 12, x + 12 + values.right * 2.4, 124, PALETTE.peach);
  arrow(ctx, x - 12, x - 12 - values.left * 2.4, 124, PALETTE.violet);
  label(ctx, 'Силы на тележке', 32, 43);
  label(ctx, 'Сумма: ' + valueWithUnit(values.right - values.left, 'Н'), 32, 278, PALETTE.peach);
}

function waveLength(values) {
  return 4 / values.frequency;
}

function drawWave(ctx, values, t) {
  const start = 45;
  const width = 548;
  const span = 16;
  const mid = 153;
  const length = waveLength(values);
  const trace = Array.from({ length: 230 }, (_, index) => {
    const x = index / 229;
    return [start + width * x, mid - 86 * values.amplitude * Math.sin(2 * Math.PI * (x * span / length - values.frequency * t))];
  });
  line(ctx, [[start, mid], [593, mid]], '#745788', 1.6, [5, 6]);
  line(ctx, trace, PALETTE.peach, 3);
  const firstCrest = ((.25 + values.frequency * t) % 1) * length;
  if (firstCrest + length <= span) {
    const left = start + width * firstCrest / span;
    const right = left + width * length / span;
    const y = mid - 86 * values.amplitude;
    dot(ctx, left, y, 5, PALETTE.yellow, true);
    dot(ctx, right, y, 5, PALETTE.yellow, true);
    line(ctx, [[left, y - 9], [left, 62], [right, 62], [right, y - 9]], PALETTE.violet, 1.2, [4, 4]);
    label(ctx, 'λ', (left + right) / 2, 54, PALETTE.label, 18, 'center');
  }
  line(ctx, [[start, 236], [593, 236]], PALETTE.violet, 1.5);
  for (let x = 0; x <= span; x += 2) {
    const location = start + width * x / span;
    line(ctx, [[location, 232], [location, 241]], PALETTE.violet, 1.5);
    label(ctx, String(x), location, 261, PALETTE.label, 14, 'center');
  }
  label(ctx, 'Положение вдоль среды, м', start, 288);
}

function circuitCurrent(values) {
  return values.closed ? values.voltage / values.resistance : 0;
}

function drawCircuit(ctx, values, t) {
  const current = circuitCurrent(values);
  const glow = current > 0 ? PALETTE.peach : PALETTE.violet;
  const x1 = 110, x2 = 530, y1 = 82, y2 = 235;
  line(ctx, [[300, y2], [x1, y2], [x1, y1], [256, y1]], glow, 3);
  line(ctx, [[384, y1], [x2, y1], [x2, 133]], glow, 3);
  line(ctx, [[x2, 173], [x2, y2], [340, y2]], glow, 3);
  line(ctx, [[300, 208], [300, 262]], PALETTE.violet, 4);
  line(ctx, [[340, 218], [340, 252]], PALETTE.violet, 4);
  const resistor = [[256, y1], ...Array.from({ length: 8 }, (_, i) => [270 + i * 14, y1 + (i % 2 ? 10 : -10)]), [384, y1]];
  line(ctx, resistor, glow, 3);
  line(ctx, [[x2, 133], values.closed ? [x2, 173] : [x2 + 27, 160]], glow, 3);
  dot(ctx, x2, 133, 5, PALETTE.yellow);
  dot(ctx, x2, 173, 5, PALETTE.yellow);
  if (current > 0) {
    for (let i = 0; i < 9; i++) {
      const d = (i * 109 + t * (24 + Math.min(current, 8) * 13)) % 1106;
      if (d < 190) dot(ctx, 300 - d, y2, 3.3, PALETTE.yellow, true);
      else if (d < 343) dot(ctx, x1, y2 - (d - 190), 3.3, PALETTE.yellow, true);
      else if (d < 763 && (d < 489 || d > 617)) dot(ctx, x1 + d - 343, y1, 3.3, PALETTE.yellow, true);
      else if (d >= 763 && d < 916) dot(ctx, x2, y1 + d - 763, 3.3, PALETTE.yellow, true);
      else if (d >= 916) dot(ctx, x2 - (d - 916), y2, 3.3, PALETTE.yellow, true);
    }
  }
  label(ctx, 'Резистор', 320, 47, PALETTE.label, 16, 'center');
  label(ctx, '+', 277, 214, PALETTE.label, 15);
  label(ctx, '−', 353, 214, PALETTE.label, 15);
  label(ctx, 'Источник напряжения', 320, 289, PALETTE.label, 16, 'center');
}

function fallDuration(values) {
  return Math.sqrt(2 * values.height / 9.8);
}

function drawProjectile(ctx, values, t) {
  const ground = 243;
  const start = 120;
  const scale = 61;
  const duration = fallDuration(values);
  const point = time => [start + scale * time * values.speed, ground - scale * (values.height - 4.9 * time * time)];
  const y = ground - scale * values.height;
  line(ctx, [[44, ground], [594, ground]], PALETTE.violet, 2);
  box(ctx, 50, y, start - 50, 8, '#9770b2', 2);
  line(ctx, [[66, y + 7], [66, ground]], '#9770b2', 4);
  line(ctx, [[104, y + 7], [104, ground]], '#9770b2', 4);
  const trace = Array.from({ length: 70 }, (_, index) => point(duration * index / 69));
  line(ctx, trace, PALETTE.violet, 2, [3, 6]);
  const [px, py] = point(Math.min(t, duration));
  line(ctx, [[px, py], [px, ground]], '#87649a', 1.5, [4, 5]);
  dot(ctx, px, py - 6, 7, PALETTE.peach, true);
  label(ctx, 'Падение с края стола', 32, 40);
  label(ctx, 'Дальность ' + valueWithUnit(values.speed * duration, 'м'), 32, 280, PALETTE.peach);
}

    readout: (v) => ['Длина волны λ: ' + valueWithUnit(waveLength(v), 'м'), 'Период T: ' + valueWithUnit(1 / v.frequency, 'с'), 'Скорость v: 4 м/с'],
    draw: drawWave, speed: .42,

    name: 'Цепи', icon: 'electric_bolt', title: 'Цепь с резистором',

    controls: [range('voltage', 'Напряжение', 'В', 0, 12, .5, 6), range('resistance', 'Сопротивление', 'Ом', 1, 12, .5, 3)],

    draw: drawCircuit, speed: 1,
    question: 'Как получить ток 2 А при напряжении 8 В?',
    solution: 'Замкни цепь и поставь сопротивление 4 Ом. По закону Ома I = 8/4 = 2 А. Если разомкнуть цепь, ток будет нулевым.',

  },

function labPage(requested, sourceId) {
  const selected = Object.hasOwn(LABS, requested) ? requested : 'motion';
  const lab = LABS[selected];
  const fromLesson = Object.hasOwn(LESSON_BY_ID, sourceId) ? LESSON_BY_ID[sourceId] : null;
  const tail = fromLesson ? '/' + fromLesson.id : '';
  main.innerHTML = `<div class="shell enter">
    ${fromLesson ? breadcrumb(lessonLink(fromLesson.id), 'Вернуться к уроку', 'book') : ''}
    ${heading('Лаборатория', 'Поменяй один параметр, предскажи результат и проверь его в симуляции.')}
    <nav class="lab-tabs" aria-label="Симуляции">
      ${Object.entries(LABS).map(([id, item]) => `<a class="button small" href="#labs/${id}${tail}" ${selected === id ? 'aria-current="page"' : ''}>${icon(item.icon)}${esc(item.name)}</a>`).join('')}
    </nav>
    <article class="card lab-card">
      <div class="lab-stage"><canvas id="lab-stage" width="${CANVAS_W * 2}" height="${CANVAS_H * 2}" role="img" aria-label="${esc(lab.title + '. Текущие значения указаны в панели опыта.')}"></canvas></div>
      <div class="lab-controls">
        <h2>${esc(lab.title)}</h2><p>${esc(lab.description)}</p>
        ${lab.controls.map(control => `<div class="lab-slider">
          <label for="lab-${control.name}">${esc(control.label)}<output id="output-${control.name}" for="lab-${control.name}"></output></label>
          <input type="range" id="lab-${control.name}" data-lab-value="${control.name}" min="${control.min}" max="${control.max}" step="${control.step}" value="${control.value}">
        </div>`).join('')}
        <div class="lab-readout" id="lab-readout" aria-label="Результаты"></div>
        <div class="lab-play">
          <button type="button" class="button primary small" data-lab-control="play">${icon('play_arrow')}Запустить</button>
          <button type="button" class="button small" data-lab-control="reset">Сбросить</button>
          ${selected === 'circuit' ? '<button type="button" class="button small" data-lab-control="switch">Разомкнуть цепь</button>' : ''}
        </div>
      </div>
      <details class="hint"><summary>Задание для опыта</summary><p>${esc(lab.question)}</p><details class="hint"><summary>Проверить прогноз</summary><p>${esc(lab.solution)}</p></details></details>
    </article>
  </div>`;

  const canvas = main.querySelector('#lab-stage');
  const ctx = canvas.getContext('2d');
  const frameControls = main.querySelector('.lab-controls');
  const readout = frameControls.querySelector('#lab-readout');
  const playControl = frameControls.querySelector('[data-lab-control="play"]');
  const inputs = [...frameControls.querySelectorAll('[data-lab-value]')];
  const values = Object.fromEntries(lab.controls.map(control => [control.name, control.value]));
  values.closed = true;
  let playing = false;
  let time = 0;
  let previousTime = null;
  let animationId = 0;
  let previousReadout = '';

  if (ctx) ctx.scale(2, 2);

  function paint() {
    if (ctx) {
      backdrop(ctx);
      lab.draw(ctx, values, time);
    }
    const nextReadout = lab.readout(values, time).map(line => `<span>${esc(line)}</span>`).join('');
    if (previousReadout !== nextReadout) {
      readout.innerHTML = nextReadout;
      previousReadout = nextReadout;
    }
  }

  function labelPlay() {
    playControl.innerHTML = playing ? icon('pause') + 'Пауза' : icon('play_arrow') + 'Запустить';
  }

  function renderFrame(timestamp) {
    if (!playing) return;
    const limit = lab.limit?.(values) ?? Infinity;
    if (previousTime !== null) time += Math.min(.05, (timestamp - previousTime) / 1000) * lab.speed;
    previousTime = timestamp;
    if (time >= limit) {
      time = limit;
      playing = false;
      labelPlay();
    }
    paint();
    if (playing) animationId = requestAnimationFrame(renderFrame);
  }

  for (const input of inputs) {
    const control = lab.controls.find(entry => entry.name === input.dataset.labValue);
    const output = frameControls.querySelector('#output-' + control.name);
    const update = () => {
      output.textContent = valueWithUnit(values[control.name], control.unit);
      input.setAttribute('aria-valuetext', output.textContent);
    };
    update();
    input.addEventListener('input', () => {
      values[control.name] = Number(input.value);
      time = Math.min(time, lab.limit?.(values) ?? Infinity);
      update();
      paint();
    });
  }

  frameControls.addEventListener('click', event => {
    const control = event.target.closest('[data-lab-control]');
    if (!control) return;
    if (control.dataset.labControl === 'play') {
      playing = !playing;
      previousTime = null;
      if (playing && time >= (lab.limit?.(values) ?? Infinity)) time = 0;
      cancelAnimationFrame(animationId);
      if (playing) animationId = requestAnimationFrame(renderFrame);
      labelPlay();
    }
    if (control.dataset.labControl === 'reset') {
      time = 0;
      previousTime = null;
      playing = false;
      cancelAnimationFrame(animationId);
      for (const input of inputs) {
        const control = lab.controls.find(entry => entry.name === input.dataset.labValue);
        input.value = control.value;
        input.dispatchEvent(new Event('input'));
      }
      values.closed = true;
      const switchControl = frameControls.querySelector('[data-lab-control="switch"]');
      if (switchControl) switchControl.textContent = 'Разомкнуть цепь';
      labelPlay();
      paint();
    }
    if (control.dataset.labControl === 'switch') {
      values.closed = !values.closed;
      control.textContent = values.closed ? 'Разомкнуть цепь' : 'Замкнуть цепь';
      paint();
    }
  });

  paint();
  document.fonts.ready.then(() => { if (canvas.isConnected) paint(); });
  return () => {
    playing = false;
    cancelAnimationFrame(animationId);
  };
}

startApp();
  </script>
